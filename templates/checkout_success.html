{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="card-title mb-4">Order Placed Successfully!</h2>
                    <p class="card-text">Thank you for your purchase. Your order has been successfully placed and is being processed.</p>
                    <p class="card-text">You will receive an email confirmation shortly.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('products') }}" class="btn btn-primary">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
